name: release
on:
  push:
    tags: ["v*"]
  # Dispatched by auto-tag.yml with `--ref v<version>`: a tag pushed by GITHUB_TOKEN does not
  # emit a push event, so the chain is dispatch → this → fdroid-repo.
  workflow_dispatch:

# Builds the release APK and attaches it to a GitHub Release for the tag.
# Unsigned until a signing key exists: add secrets RASEED_KEYSTORE_B64, RASEED_KEYSTORE_PASSWORD,
# RASEED_KEY_ALIAS, RASEED_KEY_PASSWORD and the signing step below activates. F-Droid builds
# from source and signs with its own key, so the unsigned artifact is still the right input there.
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to dispatch fdroid-repo below
    # Job level, not step level: a step's own `env:` block is NOT in the `env` context when that
    # step's `if:` is evaluated, and `secrets` is not available in a step `if:` at all. Declaring
    # this inside the signing step made its condition permanently false, so signing never ran and
    # the release quietly shipped an unsigned APK.
    env:
      KEYSTORE_B64: ${{ secrets.RASEED_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:assembleRelease --no-daemon
      - name: privacy gate — no INTERNET permission
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump permissions androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk | tee perms.txt
          ! grep -q "android.permission.INTERNET" perms.txt
      # Secrets are passed through env, never interpolated into the script. `${{ }}` substitutes
      # into the script TEXT before bash parses it, so a password containing a quote or `$(` would
      # be executed; and `--ks-pass pass:<literal>` would put the signing password in argv, where
      # any other process on the runner can read it. apksigner's `env:` form avoids both.
      - name: sign (only when secrets exist)
        if: env.KEYSTORE_B64 != ''
        env:
          KS_PASS: ${{ secrets.RASEED_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RASEED_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RASEED_KEY_ALIAS }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > ks.jks
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" sign --ks ks.jks --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "androidApp/build/outputs/apk/release/tidybox-$TAG.apk" \
            androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk

      # Separate step with always(), so a failed signing run does not leave the keystore on disk
      # for the upload step to pick up.
      - name: shred the keystore
        if: always()
        run: rm -f ks.jks
      - name: name the artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd androidApp/build/outputs/apk/release
          if [ -f "tidybox-$TAG.apk" ]; then
            echo "signed APK present"
          else
            echo "::warning::no signing secrets — publishing an UNSIGNED APK, which cannot be installed directly"
            cp androidApp-release-unsigned.apk "tidybox-$TAG-unsigned.apk"
          fi
          sha256sum tidybox-*.apk > SHA256SUMS
      # Pinned by SHA: this action holds `contents: write` on a repo that publishes installable
      # APKs, and a tag is mutable. SHA is softprops/action-gh-release v2.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            androidApp/build/outputs/apk/release/tidybox-*.apk
            androidApp/build/outputs/apk/release/SHA256SUMS
          generate_release_notes: true
      # A release created with GITHUB_TOKEN does not emit `release: published` to other workflows
      # (GitHub suppresses token-caused events to stop loops), so fdroid-repo never fired on its
      # own — v0.1.2 needed a manual dispatch. Chain it explicitly instead.
      - name: publish the F-Droid repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fdroid-repo.yml --ref main
